[workspace]
resolver = "3"
members = ["crates/pps-protocol", "crates/pps-server", "crates/pps-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RyanBordin/Parlo-Player-Server"

[workspace.dependencies]
pps-protocol = { path = "crates/pps-protocol" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
iroh = "1.4"
iroh-tickets = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
